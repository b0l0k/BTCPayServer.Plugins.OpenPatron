name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -m:1
      - name: Test
        run: dotnet test --no-build --verbosity normal --filter "Playwright!=Playwright" BTCPayServer.Plugins.OpenPatron.Tests/BTCPayServer.Plugins.OpenPatron.Tests.csproj
